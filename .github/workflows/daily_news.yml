name: Daily AI News

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

# 只需要讀 repo；預設權限會給 GITHUB_TOKEN 更多寫入權限
permissions:
  contents: read

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 第三方 action 一律釘 commit SHA（tag 可以被改指到別的 commit）。升級：查官方 repo 新版 tag 對應的 SHA，連同註解一起改
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run daily news bot
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MY_WORLD_API_URL: ${{ secrets.MY_WORLD_API_URL }}
          MY_WORLD_NEWS_API_KEY: ${{ secrets.MY_WORLD_NEWS_API_KEY }}
        run: python main.py
